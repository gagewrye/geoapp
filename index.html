<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoplatform</title>
  </head>
  <body>
    <aside id="panel">
      <h1>Geoplatform</h1>
      <label>Open GeoTIFF <input id="open-raster" type="file" accept=".tif,.tiff,image/tiff" /></label>
      <p id="raster-info"></p>
      <fieldset id="brush-panel" hidden>
        <legend>Labels</legend>
        <div class="row">
          <button id="mode-paint" type="button" aria-pressed="true">Paint</button>
          <button id="mode-pan" type="button" aria-pressed="false">Pan</button>
        </div>
        <div class="row">
          <button id="brush-smaller" type="button" aria-label="Smaller brush">&minus;</button>
          <span id="brush-size">Brush: 7 px</span>
          <button id="brush-larger" type="button" aria-label="Larger brush">+</button>
        </div>
        <ul id="classes"></ul>
        <button id="class-add" type="button">Add class</button>
      </fieldset>
      <fieldset>
        <legend>AlphaEarth embeddings</legend>
        <div class="row">
          <button id="aef-draw" type="button">Draw area</button>
          <label>Year <select id="aef-year"></select></label>
        </div>
        <button id="aef-fetch" type="button" disabled>Fetch embeddings</button>
        <p id="aef-info"></p>
        <label>Open AlphaEarth file <input id="open-aef" type="file" accept=".tif,.tiff,image/tiff" /></label>
        <label><input id="aef-preview" type="checkbox" disabled /> AlphaEarth preview</label>
        <p id="aef-attribution" hidden>The AlphaEarth Foundations Satellite Embedding dataset is produced by Google and Google DeepMind.</p>
      </fieldset>
      <fieldset>
        <legend>Model</legend>
        <button id="train" type="button">Train</button>
        <button id="classify" type="button">Classify and export</button>
        <button id="save-model" type="button">Save model</button>
        <label>Load model <input id="load-model" type="file" accept=".json,application/json" /></label>
      </fieldset>
      <p id="message" role="status" aria-live="polite"></p>
    </aside>
    <main id="map"></main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
