<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoplatform</title>
  </head>
  <body>
    <aside id="panel">
      <h1>Geoplatform</h1>
      <label>Open GeoTIFF <input id="open-raster" type="file" accept=".tif,.tiff,image/tiff" /></label>
      <p id="raster-info"></p>
      <fieldset id="brush-panel" hidden>
        <legend>Labels</legend>
        <div class="row">
          <button id="mode-paint" type="button" aria-pressed="true">Paint</button>
          <button id="mode-pan" type="button" aria-pressed="false">Pan</button>
        </div>
        <div class="row">
          <button id="brush-smaller" type="button" aria-label="Smaller brush">&minus;</button>
          <span id="brush-size">Brush: 7 px</span>
          <button id="brush-larger" type="button" aria-label="Larger brush">+</button>
        </div>
        <button id="undo" type="button" disabled>Undo</button>
        <ul id="classes"></ul>
        <button id="class-add" type="button">Add class</button>
        <label>Seed mode <select id="seed-mode" disabled><option value="merge">Merge</option><option value="replace">Replace</option></select></label>
        <label>Class map (optional) <input id="class-map" type="file" accept=".json,application/json" /></label>
        <label>Import labels <input id="import-labels" type="file" accept=".tif,.tiff,image/tiff" /></label>
        <button id="export-labels" type="button">Export labels</button>
      </fieldset>
      <p id="message" role="status" aria-live="polite"></p>
    </aside>
    <main id="map"></main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
