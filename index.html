<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoplatform</title>
  </head>
  <body>
    <aside id="panel">
      <h1>Geoplatform</h1>
      <label>Open GeoTIFF <input id="open-raster" type="file" accept=".tif,.tiff,image/tiff" /></label>
      <p id="raster-info"></p>
      <progress id="open-progress" hidden></progress>
      <fieldset id="brush-panel" hidden>
        <legend>Labels</legend>
        <div class="row">
          <button id="mode-paint" type="button" aria-pressed="false">Paint</button>
          <button id="mode-pan" type="button" aria-pressed="true">Pan</button>
        </div>
        <div class="row">
          <button id="brush-smaller" type="button" aria-label="Smaller brush">&minus;</button>
          <span id="brush-size">Brush: 7 px</span>
          <button id="brush-larger" type="button" aria-label="Larger brush">+</button>
        </div>
        <input id="brush-size-range" type="range" min="1" max="127" step="2" value="7" aria-label="Brush size" />
        <div id="label-opacity-text">Opacity: 60%</div>
        <input id="label-opacity" type="range" min="0" max="100" step="5" value="60" aria-label="Opacity" />
        <label><input id="show-labels" type="checkbox" checked /> Show labels</label>
        <button id="undo" type="button" disabled>Undo</button>
        <ul id="classes"></ul>
        <button id="class-add" type="button">Add class</button>
        <label>Class map (optional) <input id="class-map" type="file" accept=".json,application/json" /></label>
        <label>Import labels <input id="import-labels" type="file" accept=".tif,.tiff,image/tiff" /></label>
        <button id="export-labels" type="button">Export labels</button>
      </fieldset>
      <p id="message" role="status" aria-live="polite"></p>
    </aside>
    <main id="map"></main>
    <script type="module" src="/src/ui/main.ts"></script>
  </body>
</html>
