# Spec 060, ADR 0036: check, then the full e2e suite in 4 shards, then one summary check to gate merges on.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # every shard finishes, so one red run lists all the failures (spec 060 amendment)
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # browsers aren't cached: Playwright's docs advise against it (a restore takes about as long as the download)
      - run: npx playwright install --with-deps chromium
      # TEMPORARY (spec 061 criteria 6-7): per-test durations as JSON; reverted before merge
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=dot,html,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results-${{ matrix.shard }}.json
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-json-${{ matrix.shard }}
          path: results-${{ matrix.shard }}.json
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ci:
    needs: [check, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.check.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ] || exit 1
